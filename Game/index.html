<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <title>Rx Racing</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main id="game">

        <canvas id="gameCanvas"></canvas>

        <div id="hud">
            <span>🏁 LAP <b id="lap">1/3</b></span>
            <span>⏱️ <b id="timer">0.0</b></span>
            <span>🏆 <b id="score">0</b></span>
        </div>

        <div id="menu">

            <h1>RX RACING</h1>

            <p>Racing Game • V1</p>

            <button id="startButton">
                START RACE
            </button>

        </div>

        <div id="finish">

            <h1>🏆 FINISH</h1>

            <p>
                Time:
                <b id="finalTime">0.0</b>s
            </p>

            <p>
                Score:
                <b id="finalScore">0</b>
            </p>

            <button id="restartButton">
                RACE AGAIN
            </button>

        </div>

        <div id="controls">

            <button id="leftButton">◀</button>

            <button id="brakeButton">
                BRAKE
            </button>

            <button id="rightButton">▶</button>

            <button id="gasButton">
                GAS
            </button>

        </div>

    </main>

    <script src="game.js"></script>

</body>

</html>
